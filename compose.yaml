services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: robocell-dev
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/ubuntu/.Xauthority
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:?set XAUTHORITY on the host to the X11 cookie file}:/home/ubuntu/.Xauthority:ro
      - ~/.codex:/home/ubuntu/.codex
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
