services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: robocell-dev
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.claude:/home/ubuntu/.claude
      - ~/.claude.json:/home/ubuntu/.claude.json
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
