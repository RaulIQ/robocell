services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: robocell-dev
    command: ["bash", "/ws/docker/workshop.sh"]
    stop_signal: SIGINT
    stop_grace_period: 20s
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/ubuntu/.Xauthority
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROBOCELL_MODE=${ROBOCELL_MODE:-workshop}
      - ROBOCELL_SCAN_SOURCE=${ROBOCELL_SCAN_SOURCE:-lidar}
      - ROBOCELL_RECOVER=${ROBOCELL_RECOVER:-false}
      - ROBOCELL_LOCALIZE=${ROBOCELL_LOCALIZE:-false}
      - ROBOCELL_RTABMAP_DATABASE=${ROBOCELL_RTABMAP_DATABASE:-}
    volumes:
      - ./:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:?set XAUTHORITY on the host to the X11 cookie file}:/home/ubuntu/.Xauthority:ro
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
