bt_navigator:
  ros__parameters:
    use_sim_time: true
    always_reload_bt_xml: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      allow_unknown: false
      tolerance: 0.1

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 15.0
    odom_topic: /odometry/filtered
    controller_plugins: [FollowPath]
    goal_checker_plugins: [goal_checker]
    progress_checker_plugins: [progress_checker]
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.25
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 12.0
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.14
      lookahead_dist: 0.35
      rotate_to_heading_angular_vel: 0.6
      use_collision_detection: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.134, 0.141], [0.134, -0.141], [-0.166, -0.141], [-0.166, 0.141]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 0.2
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          raytrace_max_range: 4.25
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      footprint: "[[0.134, 0.141], [0.134, -0.141], [-0.166, -0.141], [-0.166, 0.141]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 0.2
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          raytrace_max_range: 4.25
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [planner_server, controller_server, bt_navigator]

twist_mux:
  ros__parameters:
    use_sim_time: true
    use_stamped: false
    topics:
      manual:
        topic: /cmd_vel_manual
        timeout: 0.25
        priority: 100
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.25
        priority: 50
