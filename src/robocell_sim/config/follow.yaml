bt_navigator:
  ros__parameters:
    use_sim_time: true
    always_reload_bt_xml: true
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      allow_unknown: false
      tolerance: 0.1
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 15.0
    odom_topic: /odometry/filtered
    controller_plugins:
    - FollowPath
    goal_checker_plugins:
    - goal_checker
    progress_checker_plugins:
    - progress_checker
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.25
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 12.0
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.0666666667
      batch_size: 1000
      vx_std: 0.12
      wz_std: 0.35
      vx_max: 0.22
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.8
      ax_max: 0.5
      ax_min: -0.5
      az_max: 1.0
      motion_model: DiffDrive
      visualize: true
      prune_distance: 1.5
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      critics:
      - ConstraintCritic
      - CostCritic
      - TargetCritic
      - GoalCritic
      - PathFollowCritic
      - PathAlignCritic
      - PreferForwardCritic
      TargetCritic:
        enabled: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.134, 0.141], [0.134, -0.141], [-0.166, -0.141], [-0.166, 0.141]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 0.2
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          raytrace_max_range: 4.25
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      rolling_window: true
      width: 8
      height: 8
      update_frequency: 5.0
      publish_frequency: 2.0
      always_send_full_costmap: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      footprint: '[[0.134, 0.141], [0.134, -0.141], [-0.166, -0.141], [-0.166, 0.141]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 0.2
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          raytrace_max_range: 4.25
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
      track_unknown_space: true
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
    - planner_server
    - controller_server
    - behavior_server
    - bt_navigator
twist_mux:
  ros__parameters:
    use_sim_time: true
    use_stamped: false
    topics:
      manual:
        topic: /cmd_vel_manual
        timeout: 0.25
        priority: 100
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.25
        priority: 50

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors::Wait
