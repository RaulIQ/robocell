[dependency-groups]
dev = ["pytest-eo @ git+https://github.com/RaulIQ/pytest-eo@0.5.0", "pybind11-stubgen==3.0.0"]

[tool.eo]
exclude = ["src/robocell_sim/setup.py"]

[tool.pyright]
typeCheckingMode = "strict"
extraPaths = ["/opt/ros/jazzy/lib/python3.12/site-packages", "src/robocell_sim"]
exclude = ["build", "install", "log", "typings"]
executionEnvironments = [
  { root = "src/robocell_sim/robocell_sim/ros", reportUnknownMemberType = false },
]
